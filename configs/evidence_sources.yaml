    citation:
      dataset: Missouri OA Facilities Management Design and Construction
      category: Missouri contract documents
      kind: official RFQ PDF excerpt
      lookup_table: generalized_evidence_index
      source_files:
        - category: contracts
          category_label: Fletcher Daniels janitorial RFQ
          file_name: FMDC18-0001-001_rfq.pdf
          source_url: https://archive.oa.mo.gov/fmdc/facilitiesoperations/addendum/FMDC18-0001-001_rfq.pdf
    text: |
      RFQ #FMDC18-0001 covers janitorial services for the Fletcher Daniels State Office Building.
      Section 2.2.6 says the contractor is not required to provide break room/kitchenette products unless otherwise specified, including cups, napkins, paper towels, and similar products.
      Section 2.4.1(h) requires restroom dispensers to be restocked to normal limits, including soap, toilet tissue, paper towels, and toilet seat covers.
      Section 2.9.5 says transition assistance includes completing daily requirements on the last effective day, including restocking all dispensers to normal limits.
      The Fletcher Daniels-specific task section adds perimeter and parking-garage trash removal, adjacent sidewalk cleaning, and first-floor restroom floor machine scrubbing.

